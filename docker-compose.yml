services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: frontend
    depends_on:
      gateway-service:
        condition: service_started
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_WS_BASE_URL: ws://localhost:8080
    ports:
      - "3000:3000"
    restart: always

  gateway-service:
    build:
      context: .
      dockerfile: ./gateway-service/Dockerfile
    container_name: gateway-service
    depends_on:
      auth-service:
        condition: service_started
      problem-service:
        condition: service_started
      submission-service:
        condition: service_started
      duel-service:
        condition: service_started
      notification-service:
        condition: service_started
    environment:
      APP_GATEWAY_SERVICES_AUTH_HTTP_URI: http://auth-service:8081
      APP_GATEWAY_SERVICES_PROBLEM_HTTP_URI: http://problem-service:8082
      APP_GATEWAY_SERVICES_SUBMISSION_HTTP_URI: http://submission-service:8083
      APP_GATEWAY_SERVICES_NOTIFICATION_HTTP_URI: http://notification-service:8084
      APP_GATEWAY_SERVICES_DUEL_HTTP_URI: http://duel-service:8085
      APP_GATEWAY_SERVICES_DUEL_WS_URI: ws://duel-service:8085
      APP_GATEWAY_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
      APP_GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS: http://*:3000,http://*:5173
    ports:
      - "8080:8080"
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  online-judge:
    build:
      context: .
      dockerfile: ./online-judge/Dockerfile
    depends_on:
      kafka:
        condition: service_started
      minio-online-judge-init:
        condition: service_completed_successfully
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_KAFKA_SUBMISSION_TOPIC: submissions
      APP_MINIO_ENDPOINT: http://minio-online-judge:9000
      APP_MINIO_ACCESS_KEY: onlinejudge-reader
      APP_MINIO_SECRET_KEY: onlinejudge-reader-secret
      APP_MINIO_TEST_CASES_BUCKET: online-judge-test-cases
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - SYS_PTRACE
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    user: root
    restart: always

  test-online-judge:
    build:
      context: .
      dockerfile: ./test-online-judge/Dockerfile
    depends_on:
      kafka:
        condition: service_started
      online-judge:
        condition: service_started
      minio-online-judge-init:
        condition: service_completed_successfully
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_KAFKA_SUBMISSION_TOPIC: submissions
      APP_MINIO_ENDPOINT: http://minio-online-judge:9000
      APP_MINIO_ACCESS_KEY: onlinejudge-writer
      APP_MINIO_SECRET_KEY: onlinejudge-writer-secret
      APP_MINIO_TEST_CASES_BUCKET: online-judge-test-cases
    restart: on-failure

  # ========== Auth Service dependencies ==========
  postgres-auth:
    image: postgres:17
    container_name: auth-postgres
    environment:
      POSTGRES_DB: rivals
      POSTGRES_USER: rivals
      POSTGRES_PASSWORD: rivals
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivals -d rivals"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: auth-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    container_name: auth-service
    depends_on:
      postgres-auth:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/rivals
      SPRING_DATASOURCE_USERNAME: rivals
      SPRING_DATASOURCE_PASSWORD: rivals
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: avatars
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 10MB
      JWT_ACCESS_SECRET: "ZDRhYzY5ZjU3YjQwNjRiZDI5MzI1Njg3ZWIyMDA5M2I1ZjQ0ZDc3ZjA2YzE3ZjM2YzFiYjUyZTk0ZjI4YmY3Yg=="
      JWT_REFRESH_SECRET: "OTQxMjM3YjVhM2YyNzQ3NTc2MjA1MjIyNTFiYjFiZDQxYTFlMzg4NTYyYmFhN2Y3MWRjMjYzYjQ5NTY3NTI5Mw=="
    ports:
      - "8081:8081"
    restart: always

  # ========== Problem Service dependencies ==========
  postgres-problem:
    image: postgres:17
    container_name: problem-postgres
    environment:
      POSTGRES_DB: problem_db
      POSTGRES_USER: problem_user
      POSTGRES_PASSWORD: problem_pass
    ports:
      - "5433:5432"
    volumes:
      - problem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U problem_user -d problem_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  problem-service:
    build:
      context: .
      dockerfile: ./problem-service/Dockerfile
    container_name: problem-service
    depends_on:
      postgres-problem:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-problem:5432/problem_db
      SPRING_DATASOURCE_USERNAME: problem_user
      SPRING_DATASOURCE_PASSWORD: problem_pass
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_ASSETS_BUCKET: problem-assets
      MINIO_TEST_ARCHIVES_BUCKET: problem-test-archives
      JWT_ACCESS_TOKEN_SECRET: "ZDRhYzY5ZjU3YjQwNjRiZDI5MzI1Njg3ZWIyMDA5M2I1ZjQ0ZDc3ZjA2YzE3ZjM2YzFiYjUyZTk0ZjI4YmY3Yg=="
    ports:
      - "8082:8082"
    restart: always

  # ========== Submission Service dependencies ==========
  postgres-submission:
    image: postgres:17
    container_name: submission-postgres
    environment:
      POSTGRES_DB: submission_db
      POSTGRES_USER: submission_user
      POSTGRES_PASSWORD: submission_pass
    ports:
      - "5434:5432"
    volumes:
      - submission_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U submission_user -d submission_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  submission-service:
    build:
      context: .
      dockerfile: ./submission-service/Dockerfile
    container_name: submission-service
    depends_on:
      postgres-submission:
        condition: service_healthy
      kafka:
        condition: service_started
      problem-service:
        condition: service_started
      minio-online-judge-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-submission:5432/submission_db
      SPRING_DATASOURCE_USERNAME: submission_user
      SPRING_DATASOURCE_PASSWORD: submission_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_PROBLEM_SERVICE_BASE_URL: http://problem-service:8082
      APP_MINIO_ENDPOINT: http://minio-online-judge:9000
      APP_MINIO_ACCESS_KEY: submission-reader
      APP_MINIO_SECRET_KEY: submission-reader-secret
      APP_MINIO_DEFAULT_BUCKET: olimp-tests
      JWT_ACCESS_TOKEN_SECRET: "ZDRhYzY5ZjU3YjQwNjRiZDI5MzI1Njg3ZWIyMDA5M2I1ZjQ0ZDc3ZjA2YzE3ZjM2YzFiYjUyZTk0ZjI4YmY3Yg=="
    ports:
      - "8083:8083"
    restart: always

  # ========== Notification Service dependencies ==========
  postgres-notification:
    image: postgres:17
    container_name: notification-postgres
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_pass
    ports:
      - "5435:5432"
    volumes:
      - notification_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-service:
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    container_name: notification-service
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      SPRING_DATASOURCE_USERNAME: notification_user
      SPRING_DATASOURCE_PASSWORD: notification_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_KAFKA_NOTIFICATION_COMMANDS_TOPIC: notification-commands.v1
      APP_KAFKA_NOTIFICATION_GROUP_ID: notification-service
      JWT_ACCESS_TOKEN_SECRET: "ZDRhYzY5ZjU3YjQwNjRiZDI5MzI1Njg3ZWIyMDA5M2I1ZjQ0ZDc3ZjA2YzE3ZjM2YzFiYjUyZTk0ZjI4YmY3Yg=="
    ports:
      - "8084:8084"
    restart: always

  # ========== Duel Service dependencies ==========
  postgres-duel:
    image: postgres:17
    container_name: duel-postgres
    environment:
      POSTGRES_DB: duel_db
      POSTGRES_USER: duel_user
      POSTGRES_PASSWORD: duel_pass
    ports:
      - "5436:5432"
    volumes:
      - duel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duel_user -d duel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  duel-service:
    build:
      context: .
      dockerfile: ./duel-service/Dockerfile
    container_name: duel-service
    depends_on:
      postgres-duel:
        condition: service_healthy
      kafka:
        condition: service_started
      problem-service:
        condition: service_started
      notification-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-duel:5432/duel_db
      SPRING_DATASOURCE_USERNAME: duel_user
      SPRING_DATASOURCE_PASSWORD: duel_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_PROBLEM_SERVICE_BASE_URL: http://problem-service:8082
      APP_KAFKA_SUBMISSION_EVENTS_TOPIC: submission-events.v1
      APP_KAFKA_SUBMISSION_EVENTS_GROUP_ID: duel-service
      APP_KAFKA_DUEL_EVENTS_TOPIC: duel-events.v1
      APP_KAFKA_NOTIFICATION_COMMANDS_TOPIC: notification-commands.v1
      JWT_ACCESS_TOKEN_SECRET: "ZDRhYzY5ZjU3YjQwNjRiZDI5MzI1Njg3ZWIyMDA5M2I1ZjQ0ZDc3ZjA2YzE3ZjM2YzFiYjUyZTk0ZjI4YmY3Yg=="
    ports:
      - "8085:8085"
    restart: always

  minio-online-judge:
    image: minio/minio:latest
    container_name: minio-online-judge
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - D:/minio_backup_data/data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-online-judge-init:
    image: minio/mc:latest
    container_name: minio-online-judge-init
    depends_on:
      minio-online-judge:
        condition: service_healthy
    volumes:
      - ./minio-online-judge/olimp-tests:/seed/olimp-tests:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio-online-judge:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/online-judge-test-cases &&
      mc mb --ignore-existing local/olimp-tests &&
      mc mirror --overwrite /seed/olimp-tests local/olimp-tests &&
      printf '%s\n' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\"],\"Resource\":[\"arn:aws:s3:::online-judge-test-cases\",\"arn:aws:s3:::olimp-tests\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::online-judge-test-cases/*\",\"arn:aws:s3:::olimp-tests/*\"]}]}' > /tmp/online-judge-readonly.json &&
      printf '%s\n' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::online-judge-test-cases\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\"],\"Resource\":[\"arn:aws:s3:::online-judge-test-cases/*\"]}]}' > /tmp/online-judge-writer.json &&
      printf '%s\n' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::olimp-tests\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::olimp-tests/*\"]}]}' > /tmp/submission-reader.json &&
      mc admin user add local onlinejudge-reader onlinejudge-reader-secret || true &&
      mc admin user add local onlinejudge-writer onlinejudge-writer-secret || true &&
      mc admin user add local submission-reader submission-reader-secret || true &&
      mc admin policy detach local online-judge-readonly --user onlinejudge-reader || true &&
      mc admin policy detach local online-judge-writer --user onlinejudge-writer || true &&
      mc admin policy detach local submission-reader --user submission-reader || true &&
      mc admin policy remove local online-judge-readonly || true &&
      mc admin policy remove local online-judge-writer || true &&
      mc admin policy remove local submission-reader || true &&
      mc admin policy create local online-judge-readonly /tmp/online-judge-readonly.json &&
      mc admin policy create local online-judge-writer /tmp/online-judge-writer.json &&
      mc admin policy create local submission-reader /tmp/submission-reader.json &&
      mc admin policy attach local online-judge-readonly --user onlinejudge-reader &&
      mc admin policy attach local online-judge-writer --user onlinejudge-writer &&
      mc admin policy attach local submission-reader --user submission-reader
      "
    restart: "no"

volumes:
  pgdata:
  minio_data:
  problem_pgdata:
  submission_pgdata:
  notification_pgdata:
  duel_pgdata:

networks:
  default:
    name: rival-network
