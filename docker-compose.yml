services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  online-judge:
    build:
      context: .
      dockerfile: ./online-judge/Dockerfile
    depends_on:
      - kafka
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_KAFKA_SUBMISSION_TOPIC: submissions
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - SYS_PTRACE
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    user: root
    restart: always

  test-online-judge:
    build:
      context: .
      dockerfile: ./test-online-judge/Dockerfile
    depends_on:
      - kafka
      - online-judge
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_KAFKA_SUBMISSION_TOPIC: submissions
    restart: on-failure

  # ========== Auth Service dependencies ==========
  postgres-auth:
    image: postgres:17
    container_name: auth-postgres
    environment:
      POSTGRES_DB: rivals
      POSTGRES_USER: rivals
      POSTGRES_PASSWORD: rivals
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivals -d rivals"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: auth-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    container_name: auth-service
    depends_on:
      postgres-auth:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/rivals
      SPRING_DATASOURCE_USERNAME: rivals
      SPRING_DATASOURCE_PASSWORD: rivals
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: avatars
      JWT_ACCESS_SECRET: "ZDRhYzY5ZjU3YjQwNjRiZDI5MzI1Njg3ZWIyMDA5M2I1ZjQ0ZDc3ZjA2YzE3ZjM2YzFiYjUyZTk0ZjI4YmY3Yg=="
      JWT_REFRESH_SECRET: "OTQxMjM3YjVhM2YyNzQ3NTc2MjA1MjIyNTFiYjFiZDQxYTFlMzg4NTYyYmFhN2Y3MWRjMjYzYjQ5NTY3NTI5Mw=="
    ports:
      - "8081:8081"
    restart: always

  # ========== Problem Service dependencies ==========
  postgres-problem:
    image: postgres:17
    container_name: problem-postgres
    environment:
      POSTGRES_DB: problem_db
      POSTGRES_USER: problem_user
      POSTGRES_PASSWORD: problem_pass
    ports:
      - "5433:5432"
    volumes:
      - problem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U problem_user -d problem_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  problem-service:
    build:
      context: .
      dockerfile: ./problem-service/Dockerfile
    container_name: problem-service
    depends_on:
      postgres-problem:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-problem:5432/problem_db
      SPRING_DATASOURCE_USERNAME: problem_user
      SPRING_DATASOURCE_PASSWORD: problem_pass
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_ASSETS_BUCKET: problem-assets
      MINIO_TEST_ARCHIVES_BUCKET: problem-test-archives
      JWT_ACCESS_TOKEN_SECRET: "ZDRhYzY5ZjU3YjQwNjRiZDI5MzI1Njg3ZWIyMDA5M2I1ZjQ0ZDc3ZjA2YzE3ZjM2YzFiYjUyZTk0ZjI4YmY3Yg=="
    ports:
      - "8082:8082"
    restart: always

volumes:
  pgdata:
  minio_data:
  problem_pgdata:

networks:
  default:
    name: rival-network