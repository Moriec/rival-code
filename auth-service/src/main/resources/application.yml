server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always
    include-exception: true

spring:
  application:
    name: auth-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/rivals
    username: rivals
    password: rivals
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
  flyway:
    enabled: true
    schemas: auth
    locations: classpath:db/migration

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: avatars

jwt:
  access-token-expiration-seconds: 900
  refresh-token-expiration-seconds: 2592000
  issuer: rivalcode-auth
  access-secret: "ZDRhYzY5ZjU3YjQwNjRiZDI5MzI1Njg3ZWIyMDA5M2I1ZjQ0ZDc3ZjA2YzE3ZjM2YzFiYjUyZTk0ZjI4YmY3Yg=="
  refresh-secret: "OTQxMjM3YjVhM2YyNzQ3NTc2MjA1MjIyNTFiYjFiZDQxYTFlMzg4NTYyYmFhN2Y3MWRjMjYzYjQ5NTY3NTI5Mw=="

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.rivalcode: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
