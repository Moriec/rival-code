server:
  port: 8084

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5435/notification_db
    username: notification_user
    password: notification_pass
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    schemas: notification
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092

app:
  kafka:
    notification-commands-topic: notification-commands.v1
    notification-group-id: notification-service

jwt:
  access-token-secret: ZDRhYzY5ZjU3YjQwNjRiZDI5MzI1Njg3ZWIyMDA5M2I1ZjQ0ZDc3ZjA2YzE3ZjM2YzFiYjUyZTk0ZjI4YmY3Yg==
  issuer: rivalcode-auth

rivalcode:
  service:
    name: notification-service
    version: 1.0-SNAPSHOT

logging:
  level:
    root: info
    com.rivalcode: debug
